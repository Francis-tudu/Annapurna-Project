<!DOCTYPE html>
<html>
<head>
<title>Annapurna - Client Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card p-4 shadow">
<h1 class="text-center">Annapurna - Client Login</h1>
<hr>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Your Name</label>
    <input type="text" name="name" class="form-control" placeholder="Enter Your Name" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Select Table</label>
    <select name="table_id" class="form-select">
      <option value="1">Table 1 - Silver</option>
      <option value="2">Table 2 - Gold</option>
      <option value="3">Table 3 - Platinum</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary w-100">View Menu</button>
</form>
<br>
<div class="text-center">
<a href="/">Home</a> | <a href="/admin">Admin</a>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
