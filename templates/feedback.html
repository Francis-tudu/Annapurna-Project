
<!DOCTYPE html>
<html>
<head>
<title>Feedback</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4 shadow rounded-4">
<h2 class="text-center">Feedback Form</h2>
<p class="text-center text-muted">We value your feedback</p>
<hr>
<form action="/feedback" method="POST">
  <div class="mb-3">
    <label class="form-label">Your Name</label>
    <input type="text" name="name" placeholder="Enter Your Name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Rating</label>
    <input type="number" name="rating" min="1" max="5" placeholder="Rating 1 to 5" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Comment</label>
    <textarea name="comment" placeholder="Write your comment here" class="form-control" rows="4" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
  <a href="/" class="btn btn-outline-dark w-100 mt-2">Back to Home</a>
</form>
</div>
</div>
</div>
</div>
</body>
</html>
