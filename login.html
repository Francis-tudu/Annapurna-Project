<!DOCTYPE html><html><head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script>
function sendOTP(){
  alert("Demo OTP is 1234 (College project me real SMS nahi lagta)");
}
function checkOTP(){
  let otp = document.getElementById('otp').value;
  if(otp == "1234"){
    let table = "{{ table }}";
    window.location.href = "/menu/" + table;
  } else {
    alert("Galat OTP! Demo OTP 1234 dalo");
  }
}
</script>
</head><body class="p-5 text-center">
<h2>Table No. {{ table }} - User Login</h2>
<div class="card p-4 mx-auto" style="max-width:400px">
<input class="form-control mb-2" placeholder="Enter Mobile Number" value="9102624853">
<button onclick="sendOTP()" class="btn btn-warning w-100 mb-3">Send OTP</button>
<input id="otp" class="form-control mb-3" placeholder="Enter OTP - 1234">
<button onclick="checkOTP()" class="btn btn-success w-100">Login & View Menu</button>
</div>
<br><a href="/" class="btn btn-secondary">Back to Home</a>
</body></html>
