
<!DOCTYPE html>
<html>
<head>
<title>Table Booking</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
<div class="d-flex justify-content-between align-items-center mb-4">
<h2>Table Booking</h2>
<a href="/admin" class="btn btn-dark">Back to Admin</a>
</div>

<div class="row">
<div class="col-md-4 mb-3">
<div class="card p-3 text-center shadow">
<h4>Table 1</h4>
<p>Silver Tier</p>
<p class="fw-bold">Rs. 1000</p>
<a href="/login?table_id=1" class="btn btn-primary">Book Now</a>
<img src="/qr_img/1" width="100" class="mt-2 mx-auto">
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3 text-center shadow">
<h4>Table 2</h4>
<p>Gold Tier</p>
<p class="fw-bold">Rs. 2000</p>
<a href="/login?table_id=2" class="btn btn-warning">Book Now</a>
<img src="/qr_img/2" width="100" class="mt-2 mx-auto">
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3 text-center shadow">
<h4>Table 3</h4>
<p>Platinum Tier</p>
<p class="fw-bold">Rs. 3000</p>
<a href="/login?table_id=3" class="btn btn-success">Book Now</a>
<img src="/qr_img/3" width="100" class="mt-2 mx-auto">
</div>
</div>
</div>

</div>
</body>
</html>
